apiVersion: meta.dev.upbound.io/v2alpha1
kind: Project
metadata:
  name: soc-poc-database-service
spec:
  apiDependencies:
  - k8s:
      version: v1.33.0
    type: k8s
  - git:
      path: cluster/crds
      ref: release-2.1
      repository: https://github.com/crossplane/crossplane
    type: crd
  crossplane:
    version: '>=v2.0.0-0'
  dependsOn:
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.upbound.io/upbound/provider-aws-rds
    version: '>=v2.4.0 <v3.0.0'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.upbound.io/upbound/provider-aws-ec2
    version: '>=v2.4.0 <v3.0.0'
  - apiVersion: pkg.crossplane.io/v1
    kind: Configuration
    package: xpkg.upbound.io/solutions/soc-poc-network-proxy
    version: v0.1.0
  - apiVersion: pkg.crossplane.io/v1
    kind: Function
    package: xpkg.upbound.io/crossplane-contrib/function-auto-ready
    version: '>=v0.7.0 <v1.0.0'
  description: |
    SOC proof of concept: a self-contained Database service. A SQLInstance takes its
    network from a local Network XR, selected by label or name and read through its
    status. On a consumer of the Network service that Network is a proxy XR.
  license: Apache-2.0
  maintainer: Upbound <support@upbound.io>
  repository: xpkg.upbound.io/solutions/soc-poc-database-service
  source: github.com/upbound/soc-poc
