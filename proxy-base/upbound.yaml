apiVersion: meta.dev.upbound.io/v2alpha1
kind: Project
metadata:
  name: soc-poc-proxy-base
spec:
  crossplane:
    version: '>=v2.0.0-0'
  dependsOn:
  - apiVersion: pkg.crossplane.io/v1
    kind: Function
    package: xpkg.upbound.io/crossplane-contrib/function-auto-ready
    version: '>=v0.7.0 <v1.0.0'
  description: |
    SOC proof of concept: the ProxyConfig API. Every generated proxy package depends
    on it. A ProxyConfig, named after a proxied XRD, points that API at the
    provider-kubernetes ProviderConfig of the service control plane that serves it.
  license: Apache-2.0
  maintainer: Upbound <support@upbound.io>
  repository: xpkg.upbound.io/solutions/soc-poc-proxy-base
  source: github.com/upbound/soc-poc
