# A Network on the database CP. It is a proxy XR: the real VPC is built by the
# Network service CP, and status comes back here as if it were local.
apiVersion: aws.platform.upbound.io/v1alpha1
kind: Network
metadata:
  name: net-a
  namespace: team-a
  labels:
    network: a
spec:
  parameters:
    id: soc-poc-net-a
    region: us-west-2
    vpcCidrBlock: 192.168.0.0/16
    subnets:
      - availabilityZone: us-west-2a
        type: public
        cidrBlock: 192.168.0.0/18
      - availabilityZone: us-west-2b
        type: public
        cidrBlock: 192.168.64.0/18
      - availabilityZone: us-west-2a
        type: private
        cidrBlock: 192.168.128.0/18
      - availabilityZone: us-west-2b
        type: private
        cidrBlock: 192.168.192.0/18
